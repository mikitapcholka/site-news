<!DOCTYPE HTML>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>News</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<header th:insert="~{blocks/header.html :: header}"></header>
<div class="container">
    <div class="nav-scroller py-1 mb-3 border-bottom">
        <nav class="nav nav-underline justify-content-between">
            <a class="nav-item nav-link link-body-emphasis active" href="/newsPageAdmin">Управление новостями</a>
            <a class="nav-item nav-link link-body-emphasis" href="/">Управление не новостями</a>
        </nav>
    </div>
</div>
<a class="btn btn-warning" href="/newsList/add">Добавить новость</a><br>
<main th:each="el : ${posts}" class="container">
    <div class="p-4 p-md-5 mb-4 rounded text-body-emphasis bg-body-secondary">
        <div class="col-lg-6 px-0">
            <h1 th:text="${el.title}" class="display-4 fst-italic"></h1>
            <p th:text="${el.description}" class="lead my-3"/>
            <a th:href="'/newsList/' + ${el.id}" class="btn btn-warning">Детальнее</a>
            <a th:href="'/newsList/' + ${el.id} + '/edit'" class="mb-1 btn btn-warning">Редактировать</a><br>
            <form th:action="'/newsList/' + ${el.id} + '/remove'" method="post">
                <button class="btn btn-warning" type="submit">Удалить</button>
            </form>
        </div>
    </div>
</main>
<footer th:insert="~{blocks/footer.html :: footer}"></footer>
</body>
</html>
