<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta name="viewport" http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <title>Login page</title>
</head>
<header th:insert="~{blocks/header.html :: header}"></header>
<body>
<form th:action="@{/registration}" method="post" class="p-1 p-md-3 mb-1 rounded text-body-emphasis bg-body-secondary">
    <div><label> User Name : <input type="text" name="username"/> </label></div>
    <div><label> Password: <input type="password" name="password"/> </label></div>
    <div><input type="submit" value="Sign In"/></div>
</form>
</body>
<footer th:insert="~{blocks/footer.html :: footer}"></footer>
</html>
